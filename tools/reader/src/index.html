<style>
    body {

      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Public Sans', sans-serif;
    }
    .utility-window {
      width: 800px;
      height: 520px;
      min-width: 600px;
      min-height: 400px;
      max-width: 800px;
      max-height: 520px;
      background-color: #000000;
      border: 1px solid #2A2A2A;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      resize: both;
      overflow: hidden;
      position: relative;
      border-radius: 16px;
      clip-path: inset(0 round 16px);
    }
    .resize-handle {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      pointer-events: none;
      opacity: 0;
    }
     header {
       -webkit-app-region: drag;
       cursor: move;
     }
     header button, header h1, header svg, header select, section select, header div {
       -webkit-app-region: no-drag;
       cursor: default;
     }
     header button {
       cursor: pointer !important;
       pointer-events: auto !important;
     }
     header button * {
       pointer-events: none;
     }
     ::-webkit-scrollbar { display: none; }
    html, body, .utility-window, section {
      overflow: hidden !important;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    /* textarea 允许自由滚动，响应鼠标滚轮 */
    textarea {
      overflow-y: scroll !important;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }
    textarea::-webkit-scrollbar {
      width: 0;
      background: transparent;
    }
    select option {
      background-color: #121212 !important;
      color: #00FF00 !important;
    }
    /* 语音选择下拉菜单固定高度，支持滚动 */
    #voice-select {
      max-height: 280px;
      overflow-y: auto;
    }
    #voice-select option {
      padding: 4px 8px;
    }
    /* 隐形滚动条样式 */
    .scrollbar-thin::-webkit-scrollbar {
      width: 4px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #2A2A2A;
      border-radius: 2px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: #3A3A3A;
    }
    /* Firefox */
    .scrollbar-thin {
      scrollbar-width: thin;
      scrollbar-color: #2A2A2A transparent;
    }
  </style>
</head>

    // 检测当前应该使用哪个 TTS 引擎
    // 根据 Azure API Key 的有效性决定：
    // - API Key 有效 → 显示 Azure 语音列表（完整高级语音）
    // - API Key 无效/不存在 → 显示 Edge 语音列表（基础语音）
    async function detectTTSEngine() {
        try {
            const settings = await invoke('get_settings_command');
            const apiKey = settings.api_key || '';
            const region = settings.region || 'eastus';
            
            // 验证 Azure API Key 是否有效
            let isAzureValid = false;
            if (apiKey) {
                try {
                    isAzureValid = await invoke('validate_azure_api_key', { 
                        apiKey: apiKey, 
                        region: region 
                    });
                } catch (e) {
                    console.log('API Key validation error:', e);
                    isAzureValid = false;
                }
            }
            
            // 根据 API Key 有效性切换语音列表
            if (isAzureValid) {
                console.log('Azure API Key is valid, using Azure voice list');
                currentVoicesByLanguage = azureVoicesByLanguage;
                return 'azure';
            } else {
                console.log('Azure API Key is invalid or not set, using Edge voice list');
                currentVoicesByLanguage = edgeVoicesByLanguage;
                return 'edge';
            }
        } catch (e) {
            console.log('Failed to detect TTS engine, defaulting to Edge');
            currentVoicesByLanguage = edgeVoicesByLanguage;
            return 'edge';
        }
    }
    
    // 更新语音列表显示

        const voices = currentVoicesByLanguage[lang] || [];

            `<option value="${v.value}">${v.label}</option>`
        ).join('');
    }

    const textarea = document.getElementById('tts-input');
    const charCount = document.getElementById('char-count');
    const playBtn = document.getElementById('btn-play');
    const velocitySlider = document.getElementById('velocity-slider');
    const velocityValue = document.getElementById('velocity-value');
    const languageSelect = document.getElementById('language-select');
    const voiceSelect = document.getElementById('voice-select');
    const saveBtn = document.getElementById('btn-save');
    const savePathDisplay = document.getElementById('save-path-display');

    // 从localStorage读取保存路径
    let savePath = localStorage.getItem('greader_save_path') || '';

    // 更新保存路径显示
    function updateSavePathDisplay() {
        if (savePath) {
            savePathDisplay.textContent = savePath;
            savePathDisplay.classList.remove('text-gray-500');
            savePathDisplay.classList.add('text-neonGreen');
        } else {
            savePathDisplay.textContent = 'Not set';
            savePathDisplay.classList.remove('text-neonGreen');
            savePathDisplay.classList.add('text-gray-500');
        }
    }

    updateSavePathDisplay();

    (async function init() {
        const engine = await detectTTSEngine();
        console.log(`TTS Engine: ${engine}`);
        updateVoiceList(languageSelect.value);
    })();

    // Update voices when language changes
    languageSelect.addEventListener('change', (e) => {
        updateVoiceList(e.target.value);
    });

    textarea.addEventListener('input', (e) => {
      charCount.textContent = `${e.target.value.length} chars`;
    });

    // Update velocity display
    velocitySlider.addEventListener('input', (e) => {
      velocityValue.textContent = `${parseFloat(e.target.value).toFixed(1)}x`;
    });

    // Save To button - 设置保存路径

        try {
            const { open } = window.__TAURI__.dialog;
            const result = await open({
                title: 'Select Save Folder',
                directory: true
            });
            if (result) {
                savePath = result;
                localStorage.setItem('greader_save_path', savePath);
                updateSavePathDisplay();
                console.log('Save path set to:', savePath);
                saveBtn.querySelector('span').textContent = 'SAVED';
                setTimeout(() => {
                    saveBtn.querySelector('span').textContent = 'Save To';
                }, 1500);
            }
        } catch (e) {
            console.error('Save dialog error:', e);
        }
    });

    // Execute button - generate speech
    playBtn.addEventListener('click', async () => {
      // 检查是否设置了保存路径
      if (!savePath) {
        playBtn.querySelector('span').textContent = 'SET PATH FIRST';
        playBtn.classList.add('animate-pulse');
        setTimeout(() => {
            playBtn.querySelector('span').textContent = 'Execute';
            playBtn.classList.remove('animate-pulse');
        }, 2000);
        return;
      }

      if(textarea.value.trim() === "") {
        textarea.classList.add('border-red-500/50');
        setTimeout(() => textarea.classList.remove('border-red-500/50'), 1000);
        return;
      }
      
      const span = playBtn.querySelector('span');
      const originalText = span.textContent;
      span.textContent = 'SYNTHESIZING...';
      playBtn.classList.add('animate-pulse');
      
      try {
        const text = textarea.value;
        const voice = voiceSelect.value;
        const velocity = parseFloat(velocitySlider.value);
        
         const result = await invoke('generate_speech', {
            text: text,
            filename: `output_${Date.now()}`,
            voice: voice,
            velocity: velocity,
            savePath: savePath
        });
        
        if (result.success) {
            span.textContent = 'SUCCESS';
        } else {
            span.textContent = 'FAILED';
            console.error('TTS Error:', result.message);
            // 显示错误提示
            const errorMsg = result.message || 'Unknown error';
            if (errorMsg.includes('Azure') && errorMsg.includes('Edge')) {
                alert('TTS Failed: Both Azure and Edge TTS failed. Please check your settings.');
            } else if (errorMsg.includes('file') || errorMsg.includes('path')) {
                alert('TTS Failed: ' + errorMsg);
            }
        }
      } catch (e) {
        span.textContent = 'ERROR';
        console.error('Invoke error:', e);
        alert('System Error: ' + e);
      }
      
      setTimeout(() => {
        span.textContent = originalText;
        playBtn.classList.remove('animate-pulse');
      }, 2000);
    });

    // 拖拽 TXT 文件到 Input Buffer
    // 阻止默认拖拽行为（在整个文档上）
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        document.body.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
        }, false);
    });
    
    // 拖拽进入 textarea 时的视觉反馈
    textarea.addEventListener('dragenter', (e) => {
        e.preventDefault();
        textarea.classList.add('border-neonGreen');
        textarea.style.borderColor = '#00FF00';
    });
    
    textarea.addEventListener('dragover', (e) => {
        e.preventDefault();
        textarea.style.borderColor = '#00FF00';
    });
    
    textarea.addEventListener('dragleave', (e) => {
        e.preventDefault();
        textarea.style.borderColor = '';
    });
    
    // 处理文件拖放
    textarea.addEventListener('drop', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        textarea.style.borderColor = '';
        
        console.log('Drop event triggered');
        
        const files = e.dataTransfer.files;
        if (files.length === 0) {
            console.log('No files dropped');
            return;
        }
        
        const file = files[0];
        console.log('Dropped file:', file.name);
        
        // 检查是否为 TXT 文件
        if (!file.name.toLowerCase().endsWith('.txt')) {
            console.log('Only .txt files are supported');
            alert('Please drop a .txt file');
            return;
        }
        
        try {
            const text = await file.text();
            textarea.value = text;
            // 触发 input 事件以更新字符计数
            textarea.dispatchEvent(new Event('input'));
            console.log('File loaded successfully:', file.name);
        } catch (err) {
            console.error('Failed to read file:', err);
            alert('Failed to read file: ' + err.message);
        }
    });

    // 当窗口重新获得焦点时，重新检测 TTS 引擎（用户可能在设置中更改了 API Key）
    window.addEventListener('focus', async () => {
        const previousEngine = currentVoicesByLanguage === azureVoicesByLanguage ? 'azure' : 'edge';
        const newEngine = await detectTTSEngine();
        
        // 如果引擎发生变化，更新语音列表
        if (previousEngine !== newEngine) {
            console.log(`TTS Engine changed: ${previousEngine} -> ${newEngine}`);
            const currentLang = languageSelect.value;
            updateVoiceList(currentLang);
            
            // 显示提示
            const originalText = playBtn.querySelector('span').textContent;
            playBtn.querySelector('span').textContent = newEngine === 'azure' ? 'AZURE MODE' : 'EDGE MODE';
            setTimeout(() => {
                playBtn.querySelector('span').textContent = originalText;
            }, 1500);
        }
    });

    // Window controls
    (function initWindowControls() {
        try {
            const { getCurrentWindow } = window.__TAURI__.window;
            
            document.getElementById('btn-minimize').addEventListener('click', async () => {
                await getCurrentWindow().minimize();
            });
            
            document.getElementById('btn-maximize').addEventListener('click', async () => {
                const win = getCurrentWindow();
                if (await win.isMaximized()) {
                    await win.unmaximize();
                } else {
                    await win.maximize();
                }
            });
            
            document.getElementById('btn-close').addEventListener('click', async () => {
                await getCurrentWindow().close();
            });
        } catch(e) {
            console.error('Window controls error:', e);
        }
    })();

    // Settings button - 直接调用后端命令打开设置窗口，无需任何 JS 窗口 API
    document.getElementById('btn-settings').onclick = async function(e) {
        e.preventDefault();
        e.stopPropagation();
        try {
            await invoke('open_settings_window');
        } catch (err) {
            console.error('Failed to open settings:', err);
        }
